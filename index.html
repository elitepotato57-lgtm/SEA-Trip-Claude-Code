<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#20262B">
<title>SE Asia Trip</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SEA Trip">
<script src="config.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
/* ============================================================
   Refined Bali Sunset: one set of design tokens for the whole app
   ============================================================ */
:root{
  --bg:#20262B; --surface:#303A40; --raised:#394449; --line:#455059; --ink:#F2F1ED; --muted:#B7BFC3; --faint:#99A4AA; --placeholder:#A6B0B5;
  --accent:#DA8667; --accent-2:#E8C6A5; --on-accent:#24150F; --accent-soft:rgba(218,134,103,.16);
  --link:#E8A288;   /* the accent, lightened a touch: readable as small text on cards (the accent itself is for fills and icons) */
  --stay:#DA8667; --food:#8CC3A6; --do:#B9A4DC; --ess:#E3C47C; --move:#7FB2D2;
  --ok:#8CC3A6; --warn:#E8C6A5; --bad:#E58B78;
  --sea:#1E5263; --land:#27343A; --land-trip:#2F4046; --border-land:#44535A;
  --r-s:6px; --r:8px; --r-l:10px;
  --shadow:0 2px 10px rgba(0,0,0,.28);
  --font:"Inter","SF Pro Text",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tabs-h:58px;
  color-scheme:dark;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#20262B; --surface:#303A40; } }
:root[data-theme="dark"]{ --bg:#20262B; --surface:#303A40; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
[hidden]{display:none !important}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px}
svg.i.xs{width:14px;height:14px}
.vis-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- frame ---------- */
.standalone nav.tabs{padding-bottom:4px}
.fill-bottom, .fill-bottom body{height:100vh;overflow:hidden}
.fill-bottom #app{position:absolute;top:0;left:0;right:0;bottom:auto;height:100vh}
.fill-bottom nav.tabs{padding-bottom:max(4px, calc(env(safe-area-inset-bottom,0px) - 18px))}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:600px;margin:0 auto;background:var(--bg);overflow:hidden}
@media (min-width:620px){ #app{border-left:1px solid var(--line);border-right:1px solid var(--line)} }
main{flex:1;position:relative;min-height:0}
#mapview,#pageview{position:absolute;inset:0}
#pageview{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ---------- bottom navigation ---------- */
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--bg);border-top:1px solid var(--line);padding:5px 6px max(5px, calc(env(safe-area-inset-bottom,0px) - 18px));flex:none}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:46px;border-radius:var(--r);color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;line-height:1.1;white-space:nowrap}
nav.tabs a .i{width:21px;height:21px}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}

/* ---------- page header (hero) ---------- */
.hero{position:relative;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;background:var(--surface);overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background:var(--hero,none) center/cover no-repeat;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(32,38,43,.55) 0%,rgba(32,38,43,.78) 55%,var(--bg) 100%);z-index:-1}
.hero-top{display:flex;align-items:center;gap:8px;min-height:36px}
.where{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:34px;padding:0 10px 0 8px;border-radius:var(--r);border:1px solid rgba(242,241,237,.22);background:rgba(32,38,43,.55);color:var(--ink);font-size:13px;font-weight:600}
.where .i{color:var(--accent)}
.where span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-top .sp{flex:1}
.hbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r);border:1px solid rgba(242,241,237,.22);background:rgba(32,38,43,.55);color:var(--ink);text-decoration:none;flex:none;position:relative}
.hbtn .n{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:700;display:grid;place-items:center}
.hero h1{font-size:26px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin-top:12px}
.hero .sub{color:var(--muted);font-size:13.5px;margin-top:3px;max-width:34em}
.hero.slim{padding-bottom:10px}
.hero.slim h1{font-size:22px;margin-top:8px}
.crumb{display:inline-flex;align-items:center;gap:4px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:600;min-height:34px;padding:0 10px 0 6px;border-radius:var(--r);border:1px solid rgba(242,241,237,.22);background:rgba(32,38,43,.55)}

/* ---------- page body ---------- */
.page{padding:12px 16px 28px}
.page h2{font-size:17px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.page h3{font-size:15px;font-weight:700}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 0 8px}
.sect a{font-size:13px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;min-height:32px;margin:-7px 0;padding:0 2px}
.note{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px;margin:0 0 12px}
.block p{margin:0 0 8px}
.block p:last-child{margin-bottom:0}
.block h2{margin-bottom:6px}
ul.known{margin:6px 0 0;padding-left:18px}
ul.known li{margin:3px 0}

/* ---------- inputs and buttons ---------- */
.field{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);flex:1;min-width:120px}
select,input[type=text],input[type=number],input[type=date],input[type=search],input[inputmode],textarea{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;font-size:16px;width:100%;color:var(--ink);min-height:42px;-webkit-appearance:none;appearance:none}
input::placeholder,textarea::placeholder{color:var(--placeholder);opacity:1}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea{min-height:84px;resize:vertical}
input[type=date]{min-width:0}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 14px;border-radius:var(--r);font-weight:600;font-size:14px;text-decoration:none;border:1px solid var(--line);background:var(--raised);color:var(--ink);text-align:center}
.btn.small{min-height:34px;padding:0 11px;font-size:13px;border-radius:var(--r-s)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.ghost{background:none}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:var(--r);border:1px solid var(--line);background:var(--raised);flex:none;text-decoration:none;color:var(--ink)}
.icon-btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:2px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:var(--r-s);font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);background:none;border:0;padding:0;min-height:34px}
.switch i{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .15s}
.switch[aria-pressed="true"]{color:var(--ink)}
.switch[aria-pressed="true"] i{background:var(--accent)}
.switch[aria-pressed="true"] i::after{transform:translateX(14px)}

/* search box */
.sbar{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 6px 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);color:var(--muted)}
.sbar input{flex:1;min-width:0;background:none;border:0;padding:0;min-height:42px;font-size:16px;color:var(--ink);outline:none}
.sbar input::-webkit-search-cancel-button{display:none}
.sbar .sbtn{width:34px;height:34px;display:grid;place-items:center;border:0;background:none;color:var(--muted);border-radius:var(--r-s);flex:none}
.sbar .sbtn[aria-pressed="true"]{color:var(--accent)}
.sbar:focus-within{border-color:var(--accent-2)}

/* chips */
.scroller{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.chip .i{width:15px;height:15px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.soft[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.chip[disabled]{opacity:.5}
.tools-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 2px}
.tools-row .sp{flex:1}
.fpanel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:12px;margin:8px 0 0;display:grid;gap:10px}
.fpanel .controls{display:flex;gap:8px;flex-wrap:wrap}
.fpanel .flags{display:flex;gap:6px;flex-wrap:wrap}

/* booking strip (Gaffs) */
.stay{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}   /* dates on one row, guests and rooms on the next: date boxes need the width */
.stay .field{min-width:0}
.stay input,.stay select{padding:8px;font-size:15px}

/* ---------- place cards ---------- */
.cards{margin-top:10px;display:grid;gap:8px}
.card{position:relative;display:grid;grid-template-columns:88px 1fr;gap:11px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:9px;min-height:106px}
.card.nophoto{grid-template-columns:44px 1fr;min-height:0}
.card:hover{border-color:var(--faint)}
.card .ph{width:88px;height:88px;border-radius:var(--r);background:var(--raised);overflow:hidden;display:grid;place-items:center;color:var(--c,var(--muted));align-self:start}
.card.nophoto .ph{width:44px;height:44px;background:color-mix(in srgb,var(--c,#888) 16%,transparent)}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{min-width:0;display:grid;gap:3px;align-content:start;padding-right:30px}
.card h3{font-size:15px;line-height:1.25;font-weight:700;letter-spacing:-.005em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .where2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .line{display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px;font-size:12.5px;color:var(--muted)}
.card .line b{color:var(--ink);font-weight:700}
.card .price{color:var(--accent-2);font-weight:700}
.card .price small{color:var(--muted);font-weight:500}
.card .blurb{font-size:12.5px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.card .open{color:var(--ok);font-weight:600}
.card .shut{color:var(--faint)}
.tag{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:var(--r-s);background:var(--raised);color:var(--muted);white-space:nowrap}
.tag.warn{color:var(--warn)}
.tag.good{color:var(--ok)}
.tag.pick{background:var(--accent-soft);color:var(--accent-2)}
.save{position:absolute;top:6px;right:6px;width:34px;height:34px;display:grid;place-items:center;border:0;background:none;color:var(--muted);border-radius:var(--r-s)}
.save[aria-pressed="true"]{color:var(--accent)}
.save[aria-pressed="true"] svg{fill:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:var(--r-l);padding:16px;color:var(--muted);margin-top:10px}
.empty b{color:var(--ink);display:block;margin-bottom:4px;font-size:15px}
.skel{height:106px;border-radius:var(--r-l);background:linear-gradient(90deg,var(--surface),var(--raised),var(--surface));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.stars{display:inline-flex;align-items:center;gap:5px;color:var(--ink);font-weight:700}
.st5{position:relative;display:inline-flex;height:13px}
.st5 .on{position:absolute;inset:0 auto 0 0;overflow:hidden;display:inline-flex;white-space:nowrap}
.st5 svg{width:13px;height:13px;flex:none}
.st5 .off svg{fill:var(--line)}
.st5 .on svg{fill:var(--accent)}

/* ---------- bottom sheet (place details, pickers) ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:2000}
.backdrop{position:absolute;inset:0;background:rgba(10,13,15,.62)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:var(--r-l) var(--r-l) 0 0;border-top:1px solid var(--line);padding:8px 16px 0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
.sheet-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.kind .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.sheet h2{font-size:22px;line-height:1.15;font-weight:700;letter-spacing:-.015em;margin:4px 0 2px}
.sheet h4{font-size:14px;font-weight:700;margin:14px 0 4px}
.photo{min-height:96px;border-radius:var(--r-l);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);margin:12px 0;padding:12px;text-align:center;font-size:13px}
.photo.has-img{padding:0;overflow:hidden;position:relative;display:block}
.photo img{display:block;width:100%;height:210px;object-fit:cover}
.photo .credit{position:absolute;left:8px;right:auto;bottom:8px;max-width:calc(100% - 16px);font-size:11.5px;background:rgba(20,25,28,.82);color:var(--ink);padding:3px 8px;border-radius:var(--r-s);text-decoration:none}
.photo .credit a{color:inherit}
.ptrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.ptrack::-webkit-scrollbar{display:none}
.pslide{flex:0 0 100%;scroll-snap-align:center;height:230px;background:var(--surface)}
.pslide img{width:100%;height:100%;object-fit:cover;display:block}
.pcount{position:absolute;right:8px;top:8px;font-size:11.5px;font-weight:700;background:rgba(20,25,28,.82);color:var(--ink);padding:3px 8px;border-radius:var(--r-s)}
.pdots{position:absolute;left:0;right:0;bottom:34px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.pdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}
.pdots i.on{background:#fff}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;font-size:14px;min-width:0;overflow-wrap:anywhere}
.fact .l{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:1px}
.fact.wide{grid-column:1/-1}
.fact .unk{color:var(--faint)}
.fact a{word-break:break-all}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.srcs{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.srcs a{color:var(--muted)}
.callout{display:flex;gap:9px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent-2);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--muted);margin:10px 0}
.callout .i{color:var(--accent-2);margin-top:1px}
.callout b{color:var(--ink)}
.pick-list{display:grid;gap:6px}
.pick-list button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600;min-height:44px}
.pick-list button small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.pick-list button[aria-pressed="true"]{border-color:var(--accent)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cgrid button{display:flex;align-items:center;gap:9px;padding:10px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:left;font-weight:600;min-height:44px}
.cgrid button[aria-pressed="true"]{border-color:var(--accent)}
.cgrid .f{font-size:20px}

/* ---------- map ---------- */
#map{position:absolute;inset:0;background:var(--land);font-family:var(--font)}
.maplibregl-map{font-family:var(--font)}
.maplibregl-ctrl-attrib{background:rgba(32,38,43,.78)!important;color:var(--faint)!important;font-size:10px!important}
.maplibregl-ctrl-attrib a{color:var(--muted)!important}
.maplibregl-ctrl-attrib-button{filter:invert(.8)}
.map-top{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:10px;right:10px;z-index:5;display:grid;gap:7px;pointer-events:none}
.map-top > *{pointer-events:auto}
.map-top .sbar{background:rgba(48,58,64,.96);box-shadow:var(--shadow)}
.map-chips{display:flex;gap:6px;overflow-x:auto;margin:0 -10px;padding:0 10px 2px;scrollbar-width:none}
.map-chips::-webkit-scrollbar{display:none}
.map-chips .chip{background:rgba(48,58,64,.96);box-shadow:0 1px 4px rgba(0,0,0,.25)}
/* on the map, "on" is an outline rather than a block of orange, so four chips lit at once stay calm */
.map-chips .chip[aria-pressed="true"]{background:rgba(57,68,73,.98);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent),0 1px 4px rgba(0,0,0,.25);color:var(--ink)}
.map-chips .chip[aria-pressed="false"] .dot{opacity:.4}
/* list mode: the list sits under the search and chips, which get a solid backing; the map buttons go */
#mapview.listmode .map-side{display:none}
#mapview.listmode .map-top::before{content:"";position:absolute;left:-10px;right:-10px;top:calc(-8px - env(safe-area-inset-top,0px));bottom:-8px;background:var(--bg);border-bottom:1px solid var(--line);z-index:-1}
.map-sugs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);max-height:52vh;overflow-y:auto}
.map-sugs button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 12px;color:var(--ink);font-size:14px;min-height:44px}
.map-sugs button:first-child{border-top:0}
.map-sugs button small{display:block;color:var(--muted);font-size:12px}
.map-sugs .hd{padding:7px 12px 4px;font-size:11.5px;font-weight:600;color:var(--faint);border-top:1px solid var(--line)}
.map-sugs .i{color:var(--muted)}
.map-side{position:absolute;right:10px;bottom:16px;z-index:4;display:flex;flex-direction:column;gap:6px;transition:bottom .15s}
.map-side .icon-btn{width:40px;height:40px;background:rgba(48,58,64,.96);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.map-mode{position:absolute;left:10px;bottom:16px;z-index:4;transition:bottom .15s}
.map-mode .seg{background:rgba(48,58,64,.96);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.map-status{position:absolute;left:50%;transform:translateX(-50%);top:calc(104px + env(safe-area-inset-top,0px));z-index:4;background:rgba(32,38,43,.9);border:1px solid var(--line);border-radius:var(--r-s);padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;pointer-events:none}
.map-msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
/* shown while the street map downloads, removed on the map's "load" event */
.map-loading{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:var(--land);color:var(--muted);font-size:13.5px;font-weight:600;pointer-events:none;transition:opacity .25s}
.map-loading > div{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:40px}
.map-loading.gone{opacity:0}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--muted);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.map-bottom{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:0 10px 10px;pointer-events:none}
.map-bottom > *{pointer-events:auto}
.preview{position:relative;display:grid;grid-template-columns:64px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:10px;box-shadow:var(--shadow)}
.preview .ph{width:64px;height:64px;border-radius:var(--r);background:color-mix(in srgb,var(--c,#888) 16%,transparent);display:grid;place-items:center;color:var(--c);overflow:hidden}
.preview .ph img{width:100%;height:100%;object-fit:cover}
.preview .body{min-width:0;padding-right:62px}
.preview .eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-2);color:color-mix(in srgb,var(--c,var(--accent)) 70%,#fff)}
.preview h3{font-size:16px;line-height:1.2;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview .m{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview .acts{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preview .save{right:38px}
.preview .close{position:absolute;top:6px;right:6px;width:34px;height:34px;display:grid;place-items:center;border:0;background:none;color:var(--muted)}
.near-title{display:inline-flex;align-items:center;gap:4px;min-height:32px;margin:0 0 6px;padding:4px 9px;border-radius:var(--r-s);background:rgba(48,58,64,.96);border:1px solid var(--line);font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-2)}
.near-title .i{width:14px;height:14px;transition:transform .15s}
.near.closed .near-title .i{transform:rotate(180deg)}
.near-row{display:flex;gap:7px;overflow-x:auto;margin:0 -10px;padding:0 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.near-row::-webkit-scrollbar{display:none}
.ncard{flex:none;width:66%;max-width:250px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;text-align:left;display:grid;gap:1px}
.ncard .k{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
.ncard .k .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.ncard b{font-size:14px;line-height:1.2;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ncard .m{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.maplist{position:absolute;inset:0;z-index:3;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(150px + env(safe-area-inset-top,0px)) 10px 24px}
.maplist .cards{margin-top:0}
.city-tag{font-size:11.5px;font-weight:600;color:var(--muted);text-shadow:0 0 3px var(--land),0 0 6px var(--land);white-space:nowrap;pointer-events:none}

/* ---------- tools ---------- */
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tool > span:last-child{min-width:0;overflow-wrap:anywhere}
.tool{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center;text-align:left;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:10px;min-height:62px}
.tool .ti{width:36px;height:36px;border-radius:var(--r);display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tool.alt .ti{background:rgba(232,198,165,.14);color:var(--accent-2)}
.tool b{display:block;font-size:14px;line-height:1.2;font-weight:700}
.tool small{display:block;font-size:12px;color:var(--muted);line-height:1.25;margin-top:1px}
.tool.wide{grid-column:1/-1}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.ebtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:66px;padding:6px 4px;text-align:center;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;line-height:1.15;text-decoration:none}
.ebtn .i{color:var(--accent-2)}
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.conv .field{min-width:0}
.big-in{font-size:20px!important;font-weight:700;padding:10px!important}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}
.quick div{background:var(--raised);border-radius:var(--r-s);padding:7px 10px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.quick span{color:var(--muted)}
.rate-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rate-row label{font-weight:600;min-width:86px;font-size:14px}
.rate-row small{grid-column:1/-1;color:var(--muted);font-size:12px;margin-top:-4px}
.tr-out{margin-top:10px}
.tr-res{display:flex;gap:10px;align-items:flex-start;background:var(--raised);border-radius:var(--r);padding:12px}
.tr-text{flex:1;font-size:22px;line-height:1.35;color:var(--ink);word-break:break-word}
.phrase{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.phrase:first-child{border-top:0}
.phrase .en{font-size:13px;color:var(--muted)}
.phrase .th{font-size:19px;line-height:1.3}
.phrase .ro{font-size:13px;color:var(--accent-2)}
.phrase .icon-btn{grid-row:1/4;grid-column:2;width:38px;height:38px}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.totals div{background:var(--raised);border-radius:var(--r);padding:9px 10px;min-width:0}
.totals b{display:block;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.totals span{font-size:11.5px;color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--raised);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.over i{background:var(--bad)}
.spend{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.spend .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.spend .what{flex:1;min-width:0}
.spend .what small{display:block;color:var(--muted);font-size:12px}
.spend .amt{text-align:right;font-weight:700;white-space:nowrap}
.spend .amt small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.spend .del{width:34px;height:34px;display:grid;place-items:center;border:0;background:none;color:var(--faint)}
.daylabel{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 2px}
.catbars{display:grid;gap:7px;margin-top:8px}
.catbars .cb{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:center;font-size:12.5px}
.catbars .cb span:first-child{color:var(--muted)}
.wx-now{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.wx-now .big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
.wx-now .i{width:40px;height:40px;color:var(--accent-2)}
.wx-days{display:grid;gap:0;margin-top:10px}
.wx-day{display:grid;grid-template-columns:76px 24px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.wx-day .i{color:var(--accent-2)}
.wx-day .r{color:var(--muted);font-size:12.5px}
.wx-mini{display:flex;align-items:center;gap:10px;width:100%;text-align:left;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:10px 12px}
.wx-mini .i{width:26px;height:26px;color:var(--accent-2)}
.wx-mini b{font-size:18px}
.chat{display:grid;gap:8px;margin:10px 0}
.msg{max-width:92%;padding:9px 11px;border-radius:var(--r-l);font-size:14px;overflow-wrap:anywhere}
.msg.me{justify-self:end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:2px}
.msg.bot{justify-self:start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:2px}
.msg.bot p{margin:0 0 6px}
.msg.bot p:last-child{margin:0}
.msg .mini{display:grid;gap:5px;margin:6px 0}
.msg .mini button{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--raised);border-radius:var(--r);padding:7px 9px;font-size:13px}
.msg .mini button small{color:var(--muted);white-space:nowrap}
.ask{display:grid;grid-template-columns:1fr auto;gap:8px;position:sticky;bottom:0;background:var(--bg);padding:8px 0}
.guide dt{font-weight:700;margin-top:10px}
.guide dd{margin:2px 0 0;color:var(--muted);font-size:14px}
.tel{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.tel:first-child{border-top:0}
.tel b{display:block}
.tel small{color:var(--muted);font-size:12.5px}
.tel .btn{min-width:86px}

/* ---------- transport (planner) ---------- */
.plan{display:grid;gap:10px}
.plan .pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end}
.plan .pair .field{min-width:0}
.sfield{position:relative}
.sfield input{width:100%}
.sfield input::-webkit-search-cancel-button{display:none}
.sugs{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:50;background:var(--raised);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);min-width:200px}
.sugs button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 11px;color:var(--ink);font-size:14px}
.sugs button:first-child{border-top:0}
.sugs button small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.sugs .hd{padding:7px 11px 3px;font-size:11.5px;color:var(--faint);border-top:1px solid var(--line)}
.tmap{height:240px;border-radius:var(--r-l);overflow:hidden;border:1px solid var(--line);margin:0 0 6px;background:var(--land);position:relative}
.trip{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:12px;margin:0 0 8px;cursor:pointer}
.trip[aria-pressed="true"]{border-color:var(--accent)}
.trip .sum{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.trip .big{font-size:20px;line-height:1.1;font-weight:700;letter-spacing:-.015em}
.trip .price{font-weight:700;text-align:right;white-space:nowrap;color:var(--accent-2)}
.trip .price small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.leg{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.leg:first-of-type{border-top:0}
.leg .li{width:30px;height:30px;border-radius:var(--r-s);display:grid;place-items:center;background:var(--raised);color:var(--move)}
.leg b{font-size:14px;font-weight:700}
.leg .m{font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:var(--r-s);background:rgba(127,178,210,.18);color:var(--move);margin-right:6px}
.badge.cheap{background:rgba(140,195,166,.18);color:var(--ok)}
.getthere{font-size:13px;color:var(--muted);background:var(--raised);border-radius:var(--r);padding:9px 11px;margin-top:8px}
details.more{margin-top:8px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px}
.kind2{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--move);font-weight:600}

/* ---------- discover ---------- */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dcard{position:relative;display:flex;align-items:flex-end;min-height:84px;padding:9px 10px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;overflow:hidden;isolation:isolate}
.dcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.dcard.pic{min-height:112px;border-color:transparent}
.dcard.pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(32,38,43,0) 25%,rgba(32,38,43,.62) 62%,rgba(32,38,43,.92));z-index:-1}
.dcard b{display:block;font-size:14.5px;line-height:1.15}
.dcard small{display:block;font-size:11.5px;color:var(--muted)}
.dcard.pic small{color:var(--ink);opacity:.86}
.entry{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:3000;background:var(--ink);color:var(--bg);padding:9px 13px;border-radius:var(--r);font-weight:600;font-size:13.5px;display:flex;gap:12px;align-items:center;max-width:92%;box-shadow:var(--shadow)}
.toast button{background:none;border:0;color:var(--bg);text-decoration:underline;font-weight:700}

</style>
</head>

</div>
<div id="sheetRoot"></div>

function fmtNum(v){
  if (v >= 100) return Math.round(v).toLocaleString("en-GB");
  const r = Math.round(v * 100) / 100;
  return r.toLocaleString("en-GB", {minimumFractionDigits: r % 1 ? 2 : 0, maximumFractionDigits: 2});
}
const money = (v, cur) => (SYM[cur] || cur + " ") + fmtNum(v);
function rangeText(p, cur){
  if (!p) return null;
  return p.length > 1 && p[1] !== p[0] ? `${money(p[0], cur)}–${fmtNum(p[1])}` : money(p[0], cur);
}
function gbpRange(p, cur){
  if (!p) return null;
  const a = toGBP(p[0], cur), b = p.length > 1 ? toGBP(p[1], cur) : null;
  return b && Math.abs(b - a) > 0.004 ? `£${fmtNum(a)}–${fmtNum(b)}` : `£${fmtNum(a)}`;
}

const convert = (v, from, to) => from === to ? v : v / rate(from) * rate(to);
function niceRound(v, cur){
  if (cur === "VND" || cur === "LAK" || cur === "IDR") return v >= 10000 ? Math.round(v / 1000) * 1000 : Math.round(v / 100) * 100;
  if (cur === "KHR") return Math.round(v / 500) * 500;
  if (cur === "THB") return v >= 50 ? Math.round(v / 5) * 5 : Math.round(v);
  return v >= 20 ? Math.round(v) : Math.round(v * 2) / 2;
}
function localRange(p, from, to){
  if (!p) return null;
  const vals = p.map(x => from === to ? x : niceRound(convert(x, from, to), to));
  return vals.length > 1 && vals[1] !== vals[0] ? `${money(vals[0], to)}–${fmtNum(vals[1])}` : money(vals[0], to);
}

/* ---------- distance ---------- */
function dist(a, b){
  const R = 6371, toR = x => x * Math.PI / 180;
  const dLa = toR(b.lat - a.lat), dLo = toR(b.lng - a.lng);
  const h = Math.sin(dLa/2)**2 + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLo/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const distShort = km => km < 1 ? `${Math.round(km*1000)} m` : km < 20 ? `${km.toFixed(1)} km` : `${Math.round(km).toLocaleString("en-GB")} km`;
const distText = km => `${distShort(km)} away`;
function inRing(lat, lng, ring){
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++){
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function countryAt(lat, lng){
  for (const c of GEO){ if (c.cc && c.p.some(r => inRing(lat, lng, r))) return c.cc; }
  // small islands may be missing from the outline, so fall back to a nearby trip city
  let best = null, bestKm = 60;
  for (const p of D.places){ const km = dist({lat, lng}, p); if (km < bestKm){ bestKm = km; best = p.cc; } }
  return best;
}

/* ---------- network helper: JSON with a timeout and an abort signal ---------- */
async function getJSON(url, {signal, timeout = 12000} = {}){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeout);
  if (signal) signal.addEventListener("abort", () => ctl.abort(), {once:true});
  try {
    const r = await fetch(url, {signal: ctl.signal});
    if (!r || !r.ok) throw new Error("HTTP " + (r ? r.status : "error"));
    return await r.json();
  } finally { clearTimeout(t); }
}

/* ---------- OpenStreetMap places, loaded tile by tile ---------- */
const PLACES_BASE = "places/";
const tile2lng = (x, z) => x / 2 ** z * 360 - 180;
const tile2lat = (y, z) => { const n = Math.PI - 2 * Math.PI * y / 2 ** z; return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))); };
const lng2tile = (lng, z) => Math.floor((lng + 180) / 360 * 2 ** z);
const lat2tile = (lat, z) => Math.floor((1 - Math.asinh(Math.tan(lat * Math.PI / 180)) / Math.PI) / 2 * 2 ** z);
function bboxDist(pt, bb){            // km from a point to a [w, s, e, n] box; 0 when inside
  const lat = clamp(pt.lat, bb[1], bb[3]), lng = clamp(pt.lng, bb[0], bb[2]);
  return lat === pt.lat && lng === pt.lng ? 0 : dist(pt, {lat, lng});

const P_MAP = {w:"web", v:"veg", vg:"vegan", d:"desc"};
function osmPlace(row, areas, grp){

  const it = {id:"o:" + row[0], osm:true, g:grp, c:CAT_OF_GRP[grp], k, n:name || (KIND[k] || {l:"Place"}).l, unnamed:!name, cc:"TH", city:a[1], area:a[0],
    lat:row[1], lng:row[2], ap:false, t:[(KIND[k] || {l:"Place"}).l], p:null, cur:null, r:null, s:[], tips:[], verified:false};
  for (const key in p) it[P_MAP[key] || key] = p[key];
  if (it.wp){ const m = /^en:(.+)$/.exec(it.wp); it.wpx = it.wp; it.wp = m ? m[1] : undefined; }
  return it;
}
const Places = {
  meta:null, state:"idle", leaves:{}, cache:new Map(), sums:{}, shards:new Map(), byId:new Map(), _ready:null, cc:"th",
  ready(){
    if (this._ready) return this._ready;
    this.state = "loading";
    this._ready = getJSON(`${PLACES_BASE}${this.cc}/meta.json`, {timeout:15000}).then(m => {
      this.meta = m; this.state = "ok";
      for (const g in m.groups) this.leaves[g] = m.groups[g].leaves.map(([z, x, y, n]) => ({g, z, x, y, n, key:`${g}/${z}-${x}-${y}`,
        bb:[tile2lng(x, z), tile2lat(y + 1, z), tile2lng(x + 1, z), tile2lat(y, z)]}));
      return m;
    }).catch(() => { this.state = "off"; this._ready = null; return null; });
    return this._ready;
  },
  leavesIn(g, bb){ return (this.leaves[g] || []).filter(l => l.bb[0] <= bb[2] && l.bb[2] >= bb[0] && l.bb[1] <= bb[3] && l.bb[3] >= bb[1]); },
  loaded(leaf){ const c = this.cache.get(leaf.key); return c && c.items ? c.items : null; },
  leaf(leaf, signal){
    let c = this.cache.get(leaf.key);
    if (c){ c.used = Date.now(); return c.promise; }
    c = {used:Date.now(), items:null};
    c.promise = getJSON(`${PLACES_BASE}${this.cc}/${leaf.g}/${leaf.z}-${leaf.x}-${leaf.y}.json`, {signal, timeout:20000}).then(t => {
      c.items = t.f.map(r => osmPlace(r, t.a, leaf.g));
      c.items.forEach(p => { if (!this.byId.has(p.id) || p.k !== "wifi") this.byId.set(p.id, p); });
      this.trim();
      return c.items;
    }).catch(e => { this.cache.delete(leaf.key); throw e; });
    this.cache.set(leaf.key, c);
    return c.promise;
  },
  trim(){                                              // keep memory steady: forget the tiles used longest ago
    if (this.cache.size <= 90) return;
    [...this.cache.entries()].filter(([, c]) => c.items).sort((a, b) => a[1].used - b[1].used).slice(0, this.cache.size - 70)
      .forEach(([k, c]) => { c.items.forEach(p => { if (this.byId.get(p.id) === p) this.byId.delete(p.id); }); this.cache.delete(k); });
  },
  /* nearest places to a point, loading only the tiles needed to be sure of the answer */
  async near(g, pt, {maxKm = 25, want = 240, test = null, signal = null, maxLeaves = 28} = {}){
    const m = await this.ready(); if (!m) return {items:[], state:"off"};
    const cand = (this.leaves[g] || []).map(l => ({l, d:bboxDist(pt, l.bb)})).filter(x => x.d <= maxKm).sort((a, b) => a.d - b.d);
    const out = []; let used = 0, more = false, failed = 0;
    for (let i = 0; i < cand.length;){
      if (out.length >= want){ out.sort((a, b) => a.km - b.km); if (out[want - 1].km <= cand[i].d) break; }
      if (used >= maxLeaves){ more = true; break; }
      const batch = cand.slice(i, i + (i === 0 ? 2 : 4)); i += batch.length; used += batch.length;
      const res = await Promise.all(batch.map(x => this.leaf(x.l, signal).catch(() => { failed++; return []; })));
      if (signal && signal.aborted) return {items:[], state:"aborted"};
      for (const items of res) for (const p of items){ const k = dist(pt, p); if (k <= maxKm && (!test || test(p))) out.push({p, km:k}); }
    }
    out.sort((a, b) => a.km - b.km);
    return {items:out.slice(0, Math.max(want, 400)).map(x => x.p), state: failed && !out.length ? "error" : "ok", more};
  },
  async summary(g){
    if (this.sums[g]) return this.sums[g];
    const m = await this.ready(); if (!m) return null;
    this.sums[g] = getJSON(`${PLACES_BASE}${this.cc}/sum-${g}.json`, {timeout:20000}).then(s => {
      const z = s.z;
      return s.cells.map(c => {
        const counts = {}; let total = 0;
        for (let i = 2; i < c.length; i += 2){ counts[s.kinds[c[i]]] = c[i + 1]; total += c[i + 1]; }
        return {lat:(tile2lat(c[1], z) + tile2lat(c[1] + 1, z)) / 2, lng:(tile2lng(c[0], z) + tile2lng(c[0] + 1, z)) / 2, counts, total};
      });
    }).catch(() => { delete this.sums[g]; return null; });
    return this.sums[g];
  },
  async findLeafPlace(g, id, lat, lng){               // used when a search result is opened
    const m = await this.ready(); if (!m) return null;
    const leaf = (this.leaves[g] || []).find(l => lng >= l.bb[0] && lng < l.bb[2] && lat >= l.bb[1] && lat < l.bb[3]);
    if (!leaf) return null;
    try { const items = await this.leaf(leaf); return items.find(p => p.id === id) || null; } catch(e){ return null; }
  },
  /* name search over the whole country, one small file per word prefix */
  async search(text, near){
    const m = await this.ready(); if (!m) return [];
    const toks = foldText(text).split(" ").filter(t => t.length > 1);
    if (!toks.length) return [];
    const stop = new Set(m.search.stop);
    const pick = toks.filter(t => !stop.has(t)).sort((a, b) => b.length - a.length)[0] || toks[0];
    let key = pick.slice(0, 2);
    if (m.search.split.includes(key)){ if (pick.length < 3) return []; key = pick.slice(0, 3); }
    let rows = this.shards.get(key);
    if (!rows){
      try { rows = await getJSON(`${PLACES_BASE}${this.cc}/search/s-${key}.json`, {timeout:12000}); } catch(e){ rows = []; }
      this.shards.set(key, rows);
    }
    const hits = [];
    for (const r of rows){
      const words = foldText(r[0]).split(" ");
      if (!toks.every(t => words.some(w => w.startsWith(t)))) continue;
      const full = foldText(r[0]).startsWith(toks.join(" "));
      const km = near ? dist(near, {lat:r[1], lng:r[2]}) : 0;
      hits.push({r, score:(full ? 0 : 60) + Math.min(km, 900) / 6 + (r[3] === "ess" ? 15 : 0)});
    }
    hits.sort((a, b) => a.score - b.score);
    return hits.slice(0, 8).map(({r}) => ({n:r[0], lat:r[1], lng:r[2], g:r[3], k:r[4], id:"o:" + r[5], area:r[6]}));
  }
};
function foldText(s){
  return String(s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9฀-๿]+/g, " ").trim();
}

  return CUR_BY_ID[id] || Places.byId.get(id) || (S.saved[id] && S.saved[id].snap) || null;
}

/* ---------- opening hours (OpenStreetMap format) ---------- */
const OH_DAYS = ["Mo","Tu","We","Th","Fr","Sa","Su"];
const OH_NAMES = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function ohParse(str){
  if (!str) return null;
  let s = String(str).trim();
  if (/^24\s*\/\s*7$/.test(s)) return {always:true};
  if (/[\[\]"]|\|\||sunrise|sunset|dawn|dusk|week|easter|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec/i.test(s)) return null;
  const week = [[],[],[],[],[],[],[]];
  const dayIdx = d => OH_DAYS.indexOf(d.slice(0, 1).toUpperCase() + d.slice(1, 2).toLowerCase());
  for (const part of s.split(";")){
    const rule = part.trim(); if (!rule) continue;
    // "Mo-Fr 08:00-12:00, Sa 09:00-12:00": a comma before a day name starts another rule that adds to the first
    const subs = rule.split(/,\s*(?=(?:Mo|Tu|We|Th|Fr|Sa|Su|PH|SH)\b)/i);
    let first = true, lastDays = null;
    for (let sub of subs){
      sub = sub.trim();
      const m = /^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su|PH|SH)(?:\s*-\s*(?:Mo|Tu|We|Th|Fr|Sa|Su))?\s*,?\s*)+)?\s*(.*)$/i.exec(sub);
      let dayPart = (m[1] || "").trim().replace(/,$/, ""), timePart = (m[2] || "").trim();
      let days;
      if (dayPart){
        days = new Set();
        for (const seg of dayPart.split(",")){
          const t = seg.trim(); if (!t || /^(PH|SH)$/i.test(t)) continue;
          const [a, b] = t.split("-").map(x => x.trim());
          const ia = dayIdx(a), ib = b ? dayIdx(b) : ia;
          if (ia < 0 || ib < 0) return null;
          for (let i = ia; ; i = (i + 1) % 7){ days.add(i); if (i === ib) break; }
        }
        if (!days.size){ first = false; continue; }             // a public-holiday-only rule: ignore it
        lastDays = days;
      } else days = lastDays && !first ? lastDays : new Set([0,1,2,3,4,5,6]);
      const replace = first || !!dayPart;
      if (/^(off|closed)$/i.test(timePart)){ days.forEach(d => week[d] = []); first = false; continue; }
      const ranges = [];
      if (!timePart) ranges.push([0, 1440]);
      else for (const tr of timePart.split(",")){
        const mm = /^(\d{1,2})[:.](\d{2})\s*(?:-\s*(\d{1,2})[:.](\d{2})|\+)?$/.exec(tr.trim());
        if (!mm) return null;
        const a = +mm[1] * 60 + +mm[2];
        let b = mm[3] != null ? +mm[3] * 60 + +mm[4] : 1440;
        if (a > 1440 || b > 2880) return null;
        if (b <= a) b += 1440;                                  // closes after midnight
        ranges.push([a, b]);
      }
      days.forEach(d => { week[d] = replace && sub === subs[0] ? ranges.slice() : week[d].concat(ranges); });
      first = false;
    }
  }
  return {week};
}
const thaiNow = () => { const d = new Date(Date.now() + 7 * 3600e3); return {day:(d.getUTCDay() + 6) % 7, min:d.getUTCHours() * 60 + d.getUTCMinutes()}; };
const hhmm = m => { m = ((m % 1440) + 1440) % 1440; return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
/* Is it open? Returns null when the hours are unknown or written in a way we can't read: unknown is never treated as open. */
function ohState(str, now = thaiNow()){
  const p = ohParse(str);
  if (!p) return null;
  if (p.always) return {open:true, text:"Open 24 hours"};
  const {day, min} = now, w = p.week;
  for (const [a, b] of w[day]) if (min >= a && min < b) return {open:true, text: a === 0 && b >= 1440 ? "Open all day" : `Open until ${hhmm(b)}`};
  for (const [a, b] of w[(day + 6) % 7]) if (b > 1440 && min < b - 1440) return {open:true, text:`Open until ${hhmm(b)}`};
  for (let i = 0; i < 8; i++){
    const d = (day + i) % 7;
    const next = w[d].map(r => r[0]).filter(a => i > 0 || a > min).sort((x, y) => x - y)[0];
    if (next != null) return {open:false, text: i === 0 ? `Closed, opens ${hhmm(next)}` : i === 1 ? `Closed, opens tomorrow ${hhmm(next)}` : `Closed, opens ${OH_NAMES[d]} ${hhmm(next)}`};
  }
  return {open:false, text:"Closed"};
}
const isOpenNow = it => { if (!it.oh) return null; if (it._oh === undefined || it._ohAt !== Math.floor(Date.now() / 60000)){ it._oh = ohState(it.oh); it._ohAt = Math.floor(Date.now() / 60000); } return it._oh; };

  const i = h.indexOf("/");

function setCountry(cc, manual){
  if (manual) S.countryMode = "manual";
  const changed = S.country !== cc;
  S.country = cc; persist();
  document.documentElement.dataset.theme = cc;

/* ---------- location ---------- */
const TEST_SPOTS = D.cities.map(c => c[0] === "Bangkok" ? ["Bangkok", 13.7466, 100.5393] : c);
function applyTestLocation(){
  if (!S.testLoc || S.testLoc === "off") return false;
  const c = TEST_SPOTS.find(x => x[0] === S.testLoc) || TEST_SPOTS[0];
  userLoc = {lat: c[1], lng: c[2]}; locStatus = "test";
  const cc = countryAt(userLoc.lat, userLoc.lng);
  if (S.countryMode === "auto" && cc && cc !== S.country){ S.country = cc; persist(); }
  return true;
}
function locate(prompted){
  if (applyTestLocation()){
    updateMe(); rerender();
    if (prompted){ if (map && ui.view === "map") flyTo(userLoc, 13); toast(`Using your test location: ${S.testLoc}. Turn it off in Settings.`); }
    return;
  }
  if (!("geolocation" in navigator)){ locStatus = "unavailable"; rerender(); if (prompted) toast("Location isn’t available here. Pick a place instead."); return; }
  locStatus = "asking";
  navigator.geolocation.getCurrentPosition(pos => {
    userLoc = {lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy};
    const cc = countryAt(userLoc.lat, userLoc.lng);
    locStatus = cc ? "ok" : "outside";
    if (S.countryMode === "auto" && cc && cc !== S.country) setCountry(cc, false);
    updateMe();
    if (prompted && map && ui.view === "map" && cc) flyTo(userLoc, 13);
    rerender();
  }, err => {
    locStatus = err && err.code === 1 ? "denied" : "unavailable";
    rerender();
    if (prompted) toast(locStatus === "denied" ? "Location is blocked. Pick a place instead." : "Couldn’t find you. Try again with signal.");
  }, {enableHighAccuracy:false, timeout:12000, maximumAge:600000});
}

/* ---------- sorting and filtering ---------- */
function bestScore(it){
  const r = it.r ? it.r / 10 : 0.5;
  const g = gbpMin(it); const cheap = g == null ? 0.4 : Math.max(0, 1 - g / 25);
  let near = 0.5; if (userLoc){ near = Math.max(0, 1 - dist(userLoc, it) / 50); }
  return r * 0.4 + cheap * 0.4 + near * 0.2;
}
/* "Recommended": researched places first, then well-known ones, then the rest, each group nearest first.
   Anything more than 40 km away drops to the end, so a researched place in the next province never beats one down the road. */
const TOP_LOW = new Set(["bar","club","massage","tour","worship"]);
function topRank(it, km){
  if (km != null && km > 40) return 5;
  if (it.cur_) return 0;
  const known = !!(it.wd || it.wp || it.wpx || it.x);
  if (it.c !== "cool") return known ? 1 : 3;
  if (isBiz(it) || TOP_LOW.has(it.k)) return known ? 2 : 4;
  return known ? 1 : 3;
}
function sortItems(items, how, pt = userLoc){
  const arr = items.slice();
  const nullLast = (a, b, f, dir) => { const x = f(a), y = f(b); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return dir * (x - y); };
  const byKm = (a, b) => pt ? dist(pt, a) - dist(pt, b) : 0;
  if (how === "top"){
    const key = new Map(arr.map(x => { const km = pt ? dist(pt, x) : null; return [x, [topRank(x, km), km || 0]]; }));
    arr.sort((a, b) => { const x = key.get(a), y = key.get(b); return x[0] - y[0] || x[1] - y[1] || a.n.localeCompare(b.n); });
  }
  else if (how === "near" && pt) arr.sort(byKm);
  else if (how === "rated") arr.sort((a, b) => nullLast(a, b, x => x.r, -1) || byKm(a, b));
  else if (how === "dear") arr.sort((a, b) => nullLast(a, b, gbpMin, -1) || byKm(a, b));
  else if (how === "match") arr.sort((a, b) => (b.cur_ ? bestScore(b) : -1) - (a.cur_ ? bestScore(a) : -1) || byKm(a, b));
  else if (how === "az") arr.sort((a, b) => a.n.localeCompare(b.n));
  else if (how === "near") arr.sort((a, b) => nullLast(a, b, x => x.r, -1) || nullLast(a, b, gbpMin, 1));
  else arr.sort((a, b) => nullLast(a, b, gbpMin, 1) || nullLast(a, b, x => x.r, -1) || byKm(a, b));
  return arr;
}
function passPrice(it, maxGBP){ if (!maxGBP) return true; const g = gbpMin(it); return g == null || g <= +maxGBP; }
function passRating(it, minR){ return !minR || (it.r != null && it.r / 2 >= minR); }

/* ---------- small renderers ---------- */
function starsHTML(r){
  if (r == null) return "";
  const five = r / 2, pct = Math.max(0, Math.min(100, five / 5 * 100));
  const row = STAR.repeat(5);
  return `<span class="stars"><span class="st5" aria-hidden="true"><span class="off">${row}</span><span class="on" style="width:${pct}%">${row}</span></span>${five.toFixed(1)}<span class="vis-hidden"> out of 5</span></span>`;
}
const cardHasPhoto = it => it.cur_ ? !!((googleKey() || it.wp) && it.c !== "move") : !!(it.wp || it.wd);
function placeCard(it, pt){
  const c = CAT[it.c] || CAT.ess, col = cssv(c.v);
  const km = pt && !pt.none ? dist(pt, it) : null;
  const photo = cardHasPhoto(it);
  const oh = isOpenNow(it);
  const line = [];
  if (it.r != null) line.push(starsHTML(it.r));
  const loc = itemLocal(it);
  if (loc) line.push(`<span class="price">${esc(loc)} <small>${esc(gbpRange(it.p, it.cur))}</small></span>`);
  else if (it.cur_ && it.cost) line.push(`<span>${esc(it.cost)}</span>`);
  if (it.st) line.push(`<span>${it.st}-star</span>`);
  if (it.cu && it.cu.length) line.push(`<span>${esc(it.cu.slice(0, 2).join(", "))}</span>`);
  if (oh) line.push(`<span class="${oh.open ? "open" : "shut"}">${esc(oh.text)}</span>`);
  if (km != null) line.push(`<span>${distShort(km)}</span>`);
  const blurb = it.cur_ ? (it.s && it.s[0]) : it.desc;      // one line on why it is worth a look, when we have one
  const tags = [];
  if (it.cur_) tags.push(it.verified ? '<span class="tag pick">Researched</span>' : '<span class="tag warn">Not checked yet</span>');
  if (it.cur_ && it.c === "gaff" && it.d && /^(Included|Free)/.test(it.d.breakfast || "")) tags.push('<span class="tag good">Breakfast included</span>');
  if (it.cur_ && it.c === "cool") (it.t || []).slice(0, 2).forEach(t => tags.push(`<span class="tag">${esc(t)}</span>`));
  if (it.osm){
    if (isBiz(it)) tags.push('<span class="tag">Business</span>');
    if (it.wifi) tags.push(`<span class="tag">${it.wifi === 2 ? "Free Wi-Fi" : "Wi-Fi"}</span>`);
    if (it.vegan) tags.push(`<span class="tag good">${it.vegan === 2 ? "Vegan" : "Vegan options"}</span>`);
    else if (it.veg) tags.push(`<span class="tag good">${it.veg === 2 ? "Vegetarian" : "Vegetarian options"}</span>`);
    if (it.pool) tags.push('<span class="tag">Pool</span>');
    if (it.ac && it.c === "gaff") tags.push('<span class="tag">Air con</span>');
    if (it.x || it.wd) tags.push('<span class="tag pick">Notable</span>');
  }
  return `<article class="card ${photo ? "" : "nophoto"}" data-open="${esc(it.id)}" role="button" tabindex="0" style="--c:${col}">
    <div class="ph" ${photo ? `data-ph="${esc(it.id)}"` : ""}>${icon(kindIcon(it))}</div>
    <div class="body"><h3>${esc(it.n)}</h3>
      <div class="where2">${esc(kindLabel(it))} · ${esc(it.area || it.city)}</div>
      ${line.length ? `<div class="line">${line.join("")}</div>` : ""}
      ${blurb ? `<div class="blurb">${esc(blurb)}</div>` : ""}
      ${tags.length ? `<div class="tags">${tags.slice(0, 3).join("")}</div>` : ""}</div>${saveBtn(it)}</article>`;
}

/* ---------- list pages ---------- */
const RADII = [[2, "Within 2 km"], [10, "10 km"], [50, "50 km"], [0, "Anywhere"]];
const LIST_COPY = {
  gaff:{title:"Gaffs", sub:"Hostels, guesthouses and hotels", ph:"Search stays by name", img:HERO_IMG.gaffs},
  munch:{title:"Munch", sub:"Street food, markets, cafés and restaurants", ph:"Search food, restaurants, street food", img:HERO_IMG.munch},
  cool:{title:"Activities", sub:"Things to do, see and experience", ph:"Search activities, sights and tours", img:HERO_IMG.activities}
};
const listRun = {gaff:{osm:[], state:"idle", key:"", ctl:null, more:false}, munch:{osm:[], state:"idle", key:"", ctl:null, more:false}, cool:{osm:[], state:"idle", key:"", ctl:null, more:false}};
function listTest(cat){
  const st = ui.lists[cat];
  const chip = CHIPS[cat].find(c => c.id === st.chip);
  const flags = cat === "gaff" ? GAFF_FLAGS.filter(f => st.flags.has(f.id)) : [];
  const words = foldText(st.q).split(" ").filter(Boolean);
  return it => {
    if (chip && chip.f && !chip.f(it)) return false;
    for (const f of flags) if (!f.f(it)) return false;
    if (st.picks && !it.cur_) return false;
    if (st.open){ const o = isOpenNow(it); if (!o || !o.open) return false; }
    if (words.length){ const hay = foldText(`${it.n} ${it.nt || ""} ${it.area || ""} ${(it.cu || []).join(" ")} ${kindLabel(it)}`); if (!words.every(w => hay.includes(w))) return false; }
    if (it.cur_ && !(passPrice(it, st.maxGBP) && passRating(it, st.minR))) return false;
    if (!it.cur_ && (st.minR || (st.maxGBP && cat !== "munch"))) return false;       // no ratings or prices in OpenStreetMap, so those filters leave them out
    return true;
  };
}
function listItems(cat){
  const st = ui.lists[cat], pt = focusPt(), run = listRun[cat], test = listTest(cat);
  let cur = D.places.filter(p => p.c === cat && test(p));
  if (!pt.none && st.radius) cur = cur.filter(p => dist(pt, p) <= st.radius);
  const osm = pt.none ? [] : run.osm.filter(p => test(p) && (!st.radius || dist(pt, p) <= st.radius));
  const how = (st.sort === "near" || st.sort === "top") && pt.none ? (cat === "cool" ? "az" : "cheap") : st.sort;
  return sortItems(cur.concat(osm), how, pt.none ? null : pt);
}

function refreshMapData(){
  if (!map || !mapLoaded) return;
  const t0 = performance.now();
  const b = map.getBounds(), z = map.getZoom();
  const padLng = (b.getEast() - b.getWest()) * .25, padLat = (b.getNorth() - b.getSouth()) * .25;
  const bb = [b.getWest() - padLng, b.getSouth() - padLat, b.getEast() + padLng, b.getNorth() + padLat];
  const inBB = p => p.lng >= bb[0] && p.lng <= bb[2] && p.lat >= bb[1] && p.lat <= bb[3];
  const feats = [], items = [];
  let loading = false, summaryMode = false, total = 0;
  if (ui.mapSaved){
    savedPlaces().forEach(p => { feats.push(featOf(p)); if (inBB(p)) items.push(p); });
  } else {
    curatedForMap().forEach(p => { feats.push(featOf(p)); if (inBB(p)) items.push(p); });
    const groups = activeGroups(), ek = essKindSet(), needed = new Set();
    if (groups.length && Places.state !== "off"){
      if (!Places.meta){ loading = true; Places.ready().then(m => { if (m){ addPinImages(); refreshMapData(); } else renderMapStatus(); }); }
      else {
        // 1. how many places are in view? (from the summary grid, a few small files)
        const cells = {}; let est = 0, sumsReady = true;
        for (const g of groups){
          const s = Places._sumData && Places._sumData[g];
          if (!s){ sumsReady = false; Places.summary(g).then(d => { (Places._sumData = Places._sumData || {})[g] = d || []; refreshMapData(); }); continue; }
          cells[g] = s.filter(c => c.lng >= bb[0] && c.lng <= bb[2] && c.lat >= bb[1] && c.lat <= bb[3]);
          for (const c of cells[g]) est += g === "ess" ? Object.entries(c.counts).reduce((a, [k, n]) => a + (ek.has(k) ? n : 0), 0) : c.total;
        }
        total = est;
        if (!sumsReady) loading = true;
        else if (z < 9.5 || est > MAP_BUDGET){
          // 2a. too many to draw one by one: show the counts
          // The further out you are, the coarser the grid the counts are added up on, so the whole country is a few hundred dots rather than 13,000.
          summaryMode = true;
          const gz = Math.min(13, Math.floor(z) + 5), sums = new Map();
          for (const g of groups) for (const c of cells[g]){
            const w = g === "ess" ? Object.entries(c.counts).reduce((a, [k, n]) => a + (ek.has(k) ? n : 0), 0) : c.total;
            if (w <= 0) continue;
            const key = lng2tile(c.lng, gz) * 16384 + lat2tile(c.lat, gz);
            let a = sums.get(key); if (!a){ a = {w:0, x:0, y:0}; sums.set(key, a); }
            a.w += w; a.x += c.lng * w; a.y += c.lat * w;

          // 2b. few enough: load just the tiles that cover the screen
          for (const g of groups) for (const leaf of Places.leavesIn(g, bb)){
            needed.add(leaf.key);
            const got = Places.loaded(leaf);
            if (got){ for (const p of got) if (inBB(p) && (g !== "ess" || ek.has(p.k))){ feats.push(featOf(p)); items.push(p); } }
            else {
              loading = true;
              if (!mapRun.pending.has(leaf.key)){
                const ctl = new AbortController(); mapRun.pending.set(leaf.key, ctl); window.__mapStats.leafFetches++;
                Places.leaf(leaf, ctl.signal).then(() => { mapRun.pending.delete(leaf.key); mapRun.failed = false; refreshMapSoon(); })
                  .catch(() => {
                    if (mapRun.pending.get(leaf.key) !== ctl) return;        // we cancelled it ourselves when it scrolled out of view: not a failure
                    mapRun.pending.delete(leaf.key); mapRun.failed = true; mapRun.loading = false; renderMapStatus();
                  });
              }
            }
          }
        }
      }
      // stop downloads for tiles that have scrolled out of view
      for (const [k, ctl] of mapRun.pending) if (!needed.has(k)){ ctl.abort(); mapRun.pending.delete(k); window.__mapStats.aborted++; }
    }
  }

  const seen = new Set(), uniq = [];

  map.getSource("pts").setData(fc(uniq));
  const seenI = new Set();
  mapRun.items = items.filter(p => !seenI.has(p.id) && seenI.add(p.id));
  mapRun.mode = summaryMode ? "summary" : "detail"; mapRun.loading = loading; mapRun.total = total; mapRun.shown = uniq.length;
  if (!loading) mapRun.failed = false;             // everything this view needs is here, so any earlier failure is behind us

}

/* ---------- search ---------- */
function localMatches(text, hubsFirst){
  const s = text.trim().toLowerCase(); if (!s) return [];
  const seen = new Set(), out = [];
  const push = (n, sub, node, extra = {}) => { const k = n.toLowerCase(); if (seen.has(k)) return; seen.add(k); out.push(Object.assign({n, sub, node}, extra)); };
  const hubs = () => Object.values(HUB).filter(h => h.n.toLowerCase().includes(s)).forEach(h => push(h.n, "Transport hub", hubNode(h.id)));
  if (hubsFirst) hubs();                 // the journey planner works best from its own hubs
  D.cities.filter(c => c[0].toLowerCase().includes(s)).forEach(c => push(c[0], hubsFirst ? "Town" : "Destination", {n:c[0], lat:c[1], lng:c[2]}, {dest:true}));
  if (!hubsFirst) hubs();
  D.places.filter(p => p.n.toLowerCase().includes(s) || p.city.toLowerCase().startsWith(s)).slice(0, 8).forEach(p => push(p.n, `${kindLabel(p)}, ${p.city}`, {n:p.n, lat:p.lat, lng:p.lng}, {id:p.id}));
  return out.slice(0, 6);
}
async function osmSearch(text){

    return j.map(x => ({n: x.name || x.display_name.split(",")[0], sub: x.display_name.split(",").slice(1, 3).join(",").trim(), node:{n: x.name || x.display_name.split(",")[0], lat:+x.lat, lng:+x.lon}}));
  } catch(e){ return null; }
}

/* ============================================================
   50-transport: the journey planner (lives in Tools). The planning logic is unchanged from v1.4.
   ============================================================ */
/* ---------- transport planner ---------- */
const NET = D.net;
const HUB = Object.fromEntries(NET.hubs.map(h => [h[0], {id:h[0], n:h[1], lat:h[2], lng:h[3], g:h[4], island:h[5]}]));
const MODE_IC = {"Train":"train","Bus":"bus","Ferry":"ship","Flight":"plane","Minivan":"bus","Bus + ferry":"ship","Taxi":"car","Local ride":"car"};
const MODE_COL = {"Train":"--accent-2","Bus":"--food","Minivan":"--food","Ferry":"--move","Bus + ferry":"--move","Flight":"--do","Taxi":"--ess","Local ride":"--ess"};
const FLIGHT_EXTRA = [2, 3], CHANGE_EXTRA = [0.5, 1];
const roadKm = (a, b) => dist(a, b) * 1.35;
function meterFare(km){
  const m = NET.taxi.meter; let f = m.flag, d = Math.max(0, km - 1);
  for (const [len, r] of m.bands){ const x = len == null ? d : Math.min(d, len); f += x * r; d -= x; if (d <= 0) break; }
  return f;
}
const LEGS = (() => {
  const opts = NET.edges.map(e => ({...e}));
  const hubs = Object.values(HUB);
  for (let i = 0; i < hubs.length; i++) for (let j = i + 1; j < hubs.length; j++){
    const a = hubs[i], b = hubs[j];
    if (a.island || b.island) continue;
    if (opts.some(o => (o.a === a.id && o.b === b.id) || (o.a === b.id && o.b === a.id))) continue;
    const km = roadKm(a, b); if (km > 60) continue;
    opts.push({a:a.id, b:b.id, mode:"Taxi", op:"Taxi, Grab or Bolt", dur:[km / 45, km / 30], p:null, cur:"THB", da:"hotel", db:"hotel",
      notes:[`About ${Math.round(km)} km by road`, "Check Grab or Bolt for the price"], src:[], verified:false});
  }
  return opts;
})();
const ADJ = {};
LEGS.forEach(o => { (ADJ[o.a] = ADJ[o.a] || []).push({o, to:o.b}); (ADJ[o.b] = ADJ[o.b] || []).push({o, to:o.a}); });
const isAir = h => h === "bkkair" || h === "dmk";
const GO12 = D.net.go12 || {};
const go12 = (a, b) => GO12[a] && GO12[b] ? `https://12go.asia/en/travel/${GO12[a]}/${GO12[b]}` : null;
const ISLAND_R = {samui:14, phangan:10, tao:5, phiphi:5, kohchang:14, lipe:3, railay:2};
let NODE = HUB;
const hubNode = id => ({id, n:HUB[id].n, lat:HUB[id].lat, lng:HUB[id].lng});
// Link a searched place (not one of the saved hubs) to the network with a local ride to the nearest hubs
function connectors(node, key){
  const legs = [];
  const add = (h, label) => {
    const km = roadKm(node, HUB[h]);
    const inBkk = dist(node, HUB.bkk) < 40 && dist(HUB[h], HUB.bkk) < 40;
    const m = inBkk ? meterFare(km) : null;
    legs.push({a:key, b:h, mode: inBkk ? "Taxi" : "Local ride", op: inBkk ? "Taxi, Grab or Bolt" : (label || "Taxi, Grab, songthaew or longtail boat, depending on the place"), dur:[Math.max(.15, km / 45), Math.max(.25, km / 28)],
      p: m ? [Math.round(m * 1.05), Math.round(m * 1.4)] : null, cur:"THB", da:null, db:null,
      notes:[`About ${Math.round(km)} km by road`, inBkk ? "Estimated from Bangkok’s taxi meter rates" : "Check Grab or Bolt for the price, or ask locally for a bus or songthaew"], src:[], verified:false});
  };
  for (const [h, r] of Object.entries(ISLAND_R)) if (dist(node, HUB[h]) <= r){ add(h, "Taxi, songthaew or scooter taxi"); return legs; }
  const ranked = Object.values(HUB).filter(h => !h.island && !isAir(h.id)).map(h => ({h:h.id, km:roadKm(node, h)})).sort((x, y) => x.km - y.km);
  const close = ranked.filter(x => x.km <= 170).slice(0, 3);
  if (close.length){ close.forEach(x => add(x.h)); return legs; }
  // further from the saved hubs but still in Thailand: link the two nearest by bus or taxi, flagged as an estimate
  if (countryAt(node.lat, node.lng) === "TH") ranked.slice(0, 2).forEach(x => legs.push({a:key, b:x.h, mode:"Bus", op:"Bus, minivan or taxi (check live)", dur:[x.km / 65, x.km / 45], p:null, cur:"THB", da:null, db:null,
    notes:[`About ${Math.round(x.km)} km by road`, "This stretch isn’t in the saved network yet, so the time is a rough estimate"], src:[], verified:false}));

function hubPaths(adj, from, to, maxLegs){
  const out = [];
  (function walk(at, seen, path){
    if (at === to && path.length){ out.push(path.slice()); return; }
    if (path.length === maxLegs) return;
    for (const {o, to:nx} of (adj[at] || [])){
      if (seen.has(nx) || (isAir(nx) && nx !== to)) continue;
      seen.add(nx); path.push({o, from:at, to:nx}); walk(nx, seen, path); path.pop(); seen.delete(nx);
    }
  })(from, new Set([from]), []);
  // a flight "from Bangkok" already leaves from an airport, so don't pair it with a leg to or from that airport
  return out.filter(legs => !legs.some((L, k) => {
    const nx = legs[k + 1];
    return nx && ((isAir(L.from) && L.to === "bkk" && nx.o.mode === "Flight") || (L.o.mode === "Flight" && L.to === "bkk" && isAir(nx.to)));
  }));
}
function planTrips(fromN, toN){
  if (!fromN || !toN) return [];
  const fk = fromN.id || "@from", tk = toN.id || "@to";
  if (fk === tk || (!fromN.id && !toN.id && dist(fromN, toN) < .3)) return [];
  NODE = Object.assign({}, HUB);
  const adj = {}; Object.keys(ADJ).forEach(k => adj[k] = ADJ[k].slice());
  const link = o => { (adj[o.a] = adj[o.a] || []).push({o, to:o.b}); (adj[o.b] = adj[o.b] || []).push({o, to:o.a}); };
  let extra = 0;
  [[fromN, "@from"], [toN, "@to"]].forEach(([n, key]) => { if (n.id) return; NODE[key] = {id:key, n:n.n, lat:n.lat, lng:n.lng}; connectors(n, key).forEach(link); extra++; });
  if (!fromN.id && !toN.id && roadKm(fromN, toN) <= 60){ const km = roadKm(fromN, toN); link({a:"@from", b:"@to", mode:"Taxi", op:"Taxi, Grab or Bolt", dur:[km / 45, km / 28], p:null, cur:"THB", da:null, db:null, notes:[`About ${Math.round(km)} km by road`], src:[], verified:false}); }
  let trips = hubPaths(adj, fk, tk, 3 + extra).map(legs => {
    let dmin = 0, dmax = 0, pmin = 0, pmax = 0, unpriced = 0, unverified = 0;
    legs.forEach((L, k) => {
      const o = L.o, fl = o.mode === "Flight";
      dmin += o.dur[0] + (fl ? FLIGHT_EXTRA[0] : 0) + (k ? CHANGE_EXTRA[0] : 0);
      dmax += o.dur[1] + (fl ? FLIGHT_EXTRA[1] : 0) + (k ? CHANGE_EXTRA[1] : 0);
      if (o.p){ pmin += toGBP(o.p[0], o.cur); pmax += toGBP(o.p[o.p.length - 1], o.cur); } else unpriced++;
      if (!o.verified) unverified++;
    });
    return {legs, dmin, dmax, mid:(dmin + dmax) / 2, pmin, pmax, unpriced, unverified};
  });
  if (!trips.length) return [];
  // local rides at either end are always unpriced outside Bangkok, so judge prices on the main legs
  const core = t => t.unpriced - t.legs.filter(L => L.from[0] === "@" || L.to[0] === "@").filter(L => !L.o.p).length;
  const best = Math.min(...trips.map(t => t.mid));
  trips = trips.filter(t => t.mid <= best * 2.5 + 2);
  const priced = trips.filter(t => !core(t));
  const keepUnpriced = new Set(trips.filter(t => core(t) && t.mid <= best * 1.6 + 1).sort((a, b) => (core(a) - core(b)) || (a.mid - b.mid)).slice(0, 3));
  trips = trips.filter(t => core(t) ? keepUnpriced.has(t)
    : !priced.some(u => u !== t && u.mid <= t.mid && u.pmin <= t.pmin && (u.mid < t.mid || u.pmin < t.pmin)));
  const fastest = trips.reduce((a, b) => a.mid <= b.mid ? a : b);
  const cheapPool = trips.filter(t => !core(t));
  const cheapest = cheapPool.length ? cheapPool.reduce((a, b) => a.pmin <= b.pmin ? a : b) : null;
  trips.forEach(t => { t.fastest = t === fastest; t.cheapest = t === cheapest; });
  trips.sort(ui.tp.sort === "cheap"
    ? (a, b) => (core(a) - core(b)) || (a.pmin - b.pmin) || (a.mid - b.mid)
    : (a, b) => (a.mid - b.mid) || (a.pmin - b.pmin));
  return trips.slice(0, 8);
}
function fh(h){
  if (h < 1) return `${Math.max(5, Math.round(h * 60 / 5) * 5)} min`;
  const r = Math.round(h * 2) / 2;
  return `${Math.floor(r)}${r % 1 ? "½" : ""} h`;
}
const fRange = (a, b) => fh(a) === fh(b) ? fh(a) : (b < 1 ? `${fh(a).replace(" min", "")}–${fh(b)}` : a < 1 ? `${fh(a)}–${fh(b)}` : `${fh(a).replace(" h", "")}–${fh(b)}`);

function getThere(stn){
  if (!userLoc || !stn || stn.lat == null) return "";
  const km = roadKm(userLoc, stn);
  if (km > 45) return "";
  if (km < 0.6) return `<div class="getthere">${esc(stn.n)} is a short walk from you.</div>`;
  const inBkk = dist(userLoc, HUB.bkk) < 40;
  if (inBkk){
    const m = meterFare(km);
    return `<div class="getthere">${esc(stn.n)} is about ${km.toFixed(1)} km from you. Taxi about ${money(Math.round(m * 1.05), "THB")}–${fmtNum(Math.round(m * 1.4))} on the meter, Grab or Bolt about ${money(Math.round(Math.max(100, m * 1.2)), "THB")}–${fmtNum(Math.round(Math.max(150, m * 1.8)))}. Estimates from Bangkok’s official meter rates.</div>`;

function tripCard(t, idx){

  const price = allUnpriced ? `<small>Price: check live</small>` : `${thb(t.pmin)}${t.pmax - t.pmin > 0.3 ? "–" + fmtNum(niceRound(t.pmax * rate("THB"), "THB")) : ""}<small>£${fmtNum(t.pmin)}${t.pmax - t.pmin > 0.3 ? "–" + fmtNum(t.pmax) : ""}${t.unpriced ? ", plus a leg without a saved price" : ""}</small>`;
  const legs = t.legs.map(L => {
    const o = L.o, fromStn = stationOf(L.from === o.a ? o.da : o.db);
    const lp = o.p ? localRange(o.p, o.cur, "THB") : "price not saved";
    return `<div class="leg"><span class="li" style="color:${cssv(MODE_COL[o.mode] || "--move")}">${icon(MODE_IC[o.mode] || "bus")}</span><div>
      <b>${esc(NODE[L.from].n)} → ${esc(NODE[L.to].n)}</b>
      <div class="m">${esc(o.mode)}${o.op ? ", " + esc(o.op) : ""}</div>
      <div class="m">${fRange(o.dur[0], o.dur[1])}${o.mode === "Flight" ? " flying, plus airport time" : ""}, ${esc(lp)}${fromStn && fromStn.lat != null ? `, from ${esc(fromStn.n)}` : ""}${o.verified ? "" : ' <span class="tag warn">Estimate</span>'}</div>
      ${go12(L.from, L.to) && o.mode !== "Taxi" && o.mode !== "Local ride" ? `<a class="btn small" style="margin-top:6px" href="${go12(L.from, L.to)}" target="_blank" rel="noopener">Book this leg on 12Go ${icon("ext","i s")}</a>` : ""}
    </div></div>`;

  const first = t.legs[0], firstStn = stationOf(first.from === first.o.a ? first.o.da : first.o.db);
  const a = NODE[t.legs[0].from].n, b = NODE[t.legs[t.legs.length - 1].to].n;

  refreshLiveRates(false).then(l => { if (l && !live && ui.view === "tools" && ui.sub === "currency" && document.activeElement !== hIn && document.activeElement !== lIn) renderPage(); });

const TR_LANGS = [["th", "Thai"], ["km", "Khmer (Cambodia)"], ["vi", "Vietnamese"], ["lo", "Lao"], ["ms", "Malay"], ["id", "Indonesian"], ["zh-CN", "Chinese (Mandarin)"]];
const TR_VOICE = {th:"th-TH", km:"km-KH", vi:"vi-VN", lo:"lo-LA", ms:"ms-MY", id:"id-ID", "zh-CN":"zh-CN", en:"en-GB"};
const trState = {text:"", lang:null, out:"", outFor:"", status:"", via:"", rev:false};
const trLang = () => trState.lang || (S.country === "SG" ? "zh-CN" : (TR_LANGS.find(l => l[0] === D.countries[S.country].lang) || TR_LANGS[0])[0]);
let trCache = {}; try { trCache = JSON.parse(localStorage.getItem("tr-cache") || "{}"); } catch(e){}
function paintTranslation(){
  const el = $("#tr-out"); if (!el) return;
  if (trState.status === "error"){ el.innerHTML = `<p class="note">Couldn’t translate. Check your signal and try again. The phrasebook below works offline.</p>`; return; }
  if (trState.status === "limit"){ el.innerHTML = `<p class="note">The free translation service has reached today’s limit. The phrasebook below still works, or add a Google key in <a href="#tools/settings">Settings</a>.</p>`; return; }
  if (!trState.out){ el.innerHTML = trState.status === "busy" ? `<p class="note">Translating…</p>` : ""; return; }
  const outLang = trState.rev ? "en" : trLang();
  el.innerHTML = `<div class="tr-res"><div class="tr-text" lang="${esc(outLang)}">${esc(trState.out)}</div><button class="icon-btn" id="tr-say" type="button" aria-label="Read it out loud">${icon("speaker")}</button></div>
    <p class="note" style="margin-top:6px">${trState.via === "google" ? "Translated by Google." : "Translated by MyMemory (free service). Machine translation can be wrong, so keep it simple."}</p>`;
  $("#tr-say").onclick = () => speak(trState.out, outLang);
}
async function translateVia(text, from, to){
  if (googleKey()){
    try {
      const r = await fetch(`https://translation.googleapis.com/language/translate/v2?key=${enc(googleKey())}`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({q:text, source:from, target:to, format:"text"})});
      const j = await r.json();
      if (r.ok && j.data) return {out:j.data.translations[0].translatedText, via:"google"};
    } catch(e){}
  }
  // free fallback, no key: MyMemory allows about 5,000 characters a day from one connection
  const j = await getJSON(`https://api.mymemory.translated.net/get?q=${enc(text)}&langpair=${enc(from.slice(0, 2))}|${enc(to === "zh-CN" ? "zh-CN" : to)}`, {timeout:10000});
  if (j.quotaFinished || /MYMEMORY WARNING/i.test((j.responseData && j.responseData.translatedText) || "")) { const e = new Error("limit"); e.limit = true; throw e; }
  if (!j.responseData || !j.responseData.translatedText) throw new Error("failed");
  return {out:j.responseData.translatedText, via:"mymemory"};
}
async function doTranslate(){
  const text = trState.text.trim(), lang = trLang(), rev = trState.rev;
  if (!text){ trState.out = ""; trState.status = ""; paintTranslation(); return; }
  const k = (rev ? "<" : "") + lang + "|" + text;
  if (trCache[k]){ trState.out = trCache[k].o || trCache[k]; trState.via = trCache[k].v || "google"; trState.status = ""; paintTranslation(); return; }
  trState.status = "busy"; if (trState.outFor !== k) trState.out = ""; paintTranslation();
  try {
    const res = await translateVia(text, rev ? lang : "en", rev ? "en" : lang);
    if (trState.text.trim() !== text || trLang() !== lang || trState.rev !== rev) return;
    trState.out = res.out; trState.via = res.via; trState.outFor = k; trState.status = "";
    trCache[k] = {o:res.out, v:res.via};
    const keys = Object.keys(trCache); if (keys.length > 300) delete trCache[keys[0]];
    try { localStorage.setItem("tr-cache", JSON.stringify(trCache)); } catch(e){}
  } catch(e){ trState.status = e.limit ? "limit" : "error"; }
  paintTranslation();
}
function speak(text, lang){
  if (!("speechSynthesis" in window)){ toast("This phone can’t read text out"); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = TR_VOICE[lang] || lang; u.rate = .85;
  const voices = speechSynthesis.getVoices();
  const v = voices.find(x => x.lang.replace("_", "-").toLowerCase() === u.lang.toLowerCase()) || voices.find(x => x.lang.toLowerCase().startsWith(u.lang.slice(0, 2).toLowerCase()));
  if (v) u.voice = v; else if (voices.length) toast("No voice for this language yet. On iPhone add one in Settings > Accessibility > Spoken Content > Voices.");
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

const budgetSpentGBP = () => S.budget.items.reduce((a, x) => a + toGBP(x.amt, x.cur), 0);
function budgetStats(){
  const b = S.budget, spent = budgetSpentGBP();
  const total = +b.total > 0 ? toGBP(+b.total, b.cur) : 0;
  const today = todayISO();
  const todaySpent = b.items.filter(x => x.at === today).reduce((a, x) => a + toGBP(x.amt, x.cur), 0);

  const perCat = {}; b.items.forEach(x => perCat[x.cat] = (perCat[x.cat] || 0) + toGBP(x.amt, x.cur));
  return {spent, total, left: total ? total - spent : null, todaySpent, avg: days ? spent / days : 0, days, perCat, daily: total && +b.days > 0 ? total / +b.days : null};
}
